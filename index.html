<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LGBTQIA+ Allyship — Regent's University London Staff Network</title>
<meta name="description" content="A short, honest allyship reflection. Regent's University London LGBTQIA+ Staff Network, Pride 2026." />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #171f20; }
  #root { min-height: 100vh; }
  .boot {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f7f1e8;
    font-family: 'Avenir Next', 'Avenir', system-ui, sans-serif;
    opacity: .5;
  }
</style>
</head>
<body>
<div id="root"><div class="boot">Loading…</div></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const C = {
  green:  "#195c4d",
  offwhite: "#f7f1e8",
  violet: "#d8cbf1",
  charcoal: "#171f20",
  gold:   "#C3A35B",
  salmon: "#FFA188",
  lime:   "#DAF092",
  sky:    "#A4DEEB",
  pink:   "#FF81B0",
  cream:  "#EEEED2",
};

/* ── SVG Rosette (eight-petal Regent's Rose) ── */
function Rose({ size = 64, spin = false }) {
  const petals = [C.salmon, C.gold, C.lime, C.violet, C.pink, C.sky, C.salmon, C.gold];
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 100 100"
      style={{
        display: "block",
        animation: spin ? "roseSpin 24s linear infinite" : "none",
      }}
      aria-hidden="true"
    >
      {petals.map((col, i) => (
        <ellipse
          key={i}
          cx="50"
          cy="26"
          rx="11"
          ry="22"
          fill={col}
          opacity="0.88"
          transform={`rotate(${i * 45} 50 50)`}
        />
      ))}
      <circle cx="50" cy="50" r="11" fill={C.offwhite} />
      <circle cx="50" cy="50" r="5.5" fill={C.gold} />
    </svg>
  );
}

const QUESTIONS = [
  {
    id: "heyguys",
    scene: "You open a meeting with "hey guys." A colleague mentioned once that they find it gendered. In the moment, you…",
    options: [
      "Don't notice you've said it",
      "Notice, but it feels too small to interrupt the flow",
      "Catch it, correct yourself fast, and move on so nobody dwells on it",
      "Catch it, correct yourself, and let the small awkwardness sit",
    ],
    reflect: "Most of us say "hey guys" without thinking. Correcting it once won't change that. You change it by catching yourself, again and again, until something like "colleagues" or "everyone" comes out instead.",
  },
  {
    id: "joke",
    scene: "A joke lands wrong. Could be homophobic, transphobic, ableist, racist, mild enough that it's "just a joke," clearly not meant with malice. Could be a senior colleague, could be a mate, could be a student in your seminar. The room half-laughs. You…",
    options: [
      "Laugh along, it's not worth it",
      "Say nothing, but have a quiet word afterwards",
      "Say nothing, and feel bad about it later",
      "Name it lightly, there and then",
    ],
    reflect: "Speaking up is always worth it. The quiet word afterwards doesn't cost much, but it leaves everyone who heard the joke having watched you stay silent. Speak up when you witness it.",
  },
  {
    id: "onequeer",
    scene: "Something about LGBTQ+ life comes up at work. It's a discussion about LGBTQ+ intersections, in particular disability and neurodiversity. There's only one or two openly queer people in the room. You…",
    options: [
      "Turn to them, they'll know best",
      "Ask them to explain, it's easier than looking it up",
      "Wait to see if they want to speak before anyone looks at them",
      "Look it up yourself, and don't make it their job to teach you",
    ],
    reflect: "It feels respectful to turn to the disabled or neurodivergent queer person in the room, like you're centring their voice, but it quietly makes them the spokesperson for everyone like them. In the words of Stonewall: "a marginalised person is not responsible for teaching you about their identity… please listen to our experiences, but don't expect us to be a spokesperson for all LGBT disabled people."",
    link: {
      label: "Stonewall: being an ally to LGBT disabled people",
      url: "https://www.stonewall.org.uk/news/8-ways-be-better-ally-lgbt-disabled-people",
    },
  },
  {
    id: "pronouns",
    scene: "You meet someone new, or you're starting a class or a meeting. Their appearance reads clearly as one gender to you. You…",
    options: [
      "Use the pronouns that seem obvious (to you)",
      "Go round the room, everyone says their pronouns",
      "Get corrected, you switch at that point",
      "Don't assume. Let people know pronouns are important, and allow a low-pressure way for people to share theirs if they want to (in their email signature, or on Blackboard)",
    ],
    reflect: "It's worth noticing how fast we gender people based on their looks. Using people's correct pronouns shows that we respect them and who they are. However, a forced round of pronouns can put someone on the spot when they don't feel safe to say. Visibility isn't safe for everyone, and for some people sharing pronouns at all is a risk. It might not always be immediately obvious what pronouns someone uses, but you can suggest people add their pronouns in their email signature, social media profile or Blackboard, if it feels safe for them, rather than demanding they declare them to a room.",
    link: {
      label: "Stonewall: 10 ways to be an ally to trans and non-binary people",
      url: "https://www.stonewall.org.uk/resources/lgbtq-hubs/trans-hub/10-ways-to-step-up-as-an-ally-to-trans-and-non-binary-people",
    },
  },
  {
    id: "getitwrong",
    scene: "You misgender someone, or use a term you hadn't clocked has shifted. You're corrected. Your first inward feeling is…",
    options: [
      "Defensiveness, you didn't mean anything by it",
      "A hot flush of embarrassment you want to escape",
      "The urge to over-apologise and explain yourself",
      "Take it in, and get it right next time",
    ],
    reflect: "Most of these slips just mean we're human and still learning. The over-apologising is a trap. It looks like taking responsibility, but it often ends with them having to reassure you. This puts the work back on them. PFLAG's line is that you can feel embarrassed, but you shouldn't make the moment about your feelings. Take responsibility, get it right next time. Being an ally is about what we do, not what we feel.",
  },
  {
    id: "samedifference",
    scene: "A colleague says they "treat everyone the same—they don't see someone's sexuality or gender." You think this is…",
    options: [
      "Fair enough, that's equality",
      "Mostly well meant, and fine",
      "Well meant, but missing something",
      "A way of not quite seeing people",
    ],
    reflect: ""I treat everyone the same" usually means treating everyone like the normative default, and that default leaves out the queer and anyone whose difference doesn't fit the norm. Not seeing difference often means not seeing what some people are up against. Most people aren't asking to be treated identically. They're asking to be seen fully.",
  },
  {
    id: "blacktrans",
    scene: "Black LGBTQIA+ people, and Black trans people especially, are too often left out of the media, of workplaces, of LGBTQ+ representation. When you notice it happening, you…",
    options: [
      "Assume the wider LGBTQ+ cause already covers them",
      "Care, but leave it to Black people to raise it",
      "Say something when it's clearly bad",
      "Use your privilege to centre and amplify Black LGBTQIA+ people, and challenge racism vocally so your spaces don't perpetuate barriers to inclusion",
    ],
    reflect: "White, cis, straight or non-disabled, most of us carry some privilege we didn't earn, some doors that open easier. Recognising it is the easy part. Using it is the work. Your allyship isn't inclusive if it leaves out Black LGBTQIA+ people, and specifically Black trans people, whose oppression is compounded and who get overlooked even within Black and within LGBTQ+ spaces.",
    link: {
      label: "Stonewall's QTIPOC Hub",
      url: "https://www.stonewall.org.uk/resources/lgbtq-hubs/qtipoc-hub",
    },
  },
  {
    id: "theroom",
    scene: "A room, plenty of LGBTQ+ and straight people, allies and supporters, you among them. Look around. Who's at the centre? Who's at the edge, or missing? Is the room still mostly white? Mostly non-disabled? The same few voices? Who else isn't here? You…",
    options: [
      "Hadn't thought about it, everyone here means well",
      "Have noticed, but assume someone closer to it will say something",
      "Mention it when it's clearly gone too far",
      "Watch who gets centred, and use whatever room you have to shift it",
    ],
    reflect: "It's tempting to think allyship runs one way, straight to queer, and stops there. It doesn't. Inside any LGBTQ+ space there are still insiders and outsiders, and the people at the edge are usually the same ones pushed out everywhere else, by ethnicity, by disability, by class, by how their queerness reads. The work is noticing who's still not in the room, and you don't have to be queer, or straight, to have a part in it.",
  },
];

const ACTIONS = {
  minute: {
    label: "Takes a minute",
    items: [
      "Add your pronouns to your email signature or display name. Costs nothing, signals plenty.",
      "Learn three terms you were unsure about. The PFLAG glossary at pflag.org/glossary is a good start.",
      "Follow one LGBTQ+ organisation or creator, and actually read what they share, not just like and scroll.",
    ],
  },
  week: {
    label: "This week",
    items: [
      "Use "partner" instead of assuming, next time it comes up.",
      "Correct a misgendering quietly, even when the person isn't in the room. Especially then.",
      "Read one of the "10 things you can do" guides from Stonewall or PFLAG.",
    ],
  },
  ready: {
    label: "When you're ready",
    items: [
      "Speak up the one time you'd normally let a "joke" slide.",
      "Amplify rather than speak over. When someone's said it well, share it and credit them.",
      "Show up where it counts, a meeting, a vote, a room where it would be easier not to.",
    ],
  },
};

export default function AllyshipQuiz() {
  const [stage, setStage] = useState("intro");
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [revealed, setRevealed] = useState(false);
  const [chosenAction, setChosenAction] = useState(null);
  const topRef = useRef(null);

  useEffect(() => {
    if (topRef.current) topRef.current.scrollTo({ top: 0, behavior: "smooth" });
  }, [idx, stage]);

  const q = QUESTIONS[idx];
  const total = QUESTIONS.length;

  function choose(optIdx) {
    setAnswers({ ...answers, [q.id]: optIdx });
    setRevealed(true);
  }
  function next() {
    setRevealed(false);
    if (idx + 1 < total) { setIdx(idx + 1); } else { setStage("result"); }
  }

  const serif = "'TS Magnole', 'Cormorant Garamond', Georgia, serif";
  const sans  = "'Avenir Next', 'Avenir', 'DM Sans', system-ui, sans-serif";

  return (
    <div
      ref={topRef}
      style={{
        minHeight: "100vh",
        background: C.charcoal,
        color: C.offwhite,
        fontFamily: sans,
        display: "flex",
        justifyContent: "center",
        overflowY: "auto",
      }}
    >
      <style>{`
        @keyframes roseSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .fade { animation: fadeUp .4s ease both; }
        .opt-btn { transition: transform .08s, border-color .18s, background .18s; }
        .opt-btn:hover { border-color: ${C.violet} !important; background: rgba(216,203,241,0.08) !important; }
        .opt-btn:active { transform: scale(.985); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      `}</style>

      <div style={{ width: "100%", maxWidth: 480, padding: "0 22px 72px" }}>

        {/* ── INTRO ── */}
        {stage === "intro" && (
          <div className="fade" style={{ paddingTop: 64, textAlign: "center" }}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 28 }}>
              <Rose size={96} spin />
            </div>
            <h1 style={{
              fontFamily: serif,
              fontWeight: 600,
              fontSize: "clamp(2rem, 8vw, 2.7rem)",
              lineHeight: 1.05,
              margin: "0 0 22px",
              letterSpacing: "-0.01em",
            }}>
              Allyship 2026
            </h1>
            <p style={{ fontSize: "1.05rem", lineHeight: 1.65, opacity: 0.88, marginBottom: 18 }}>
              Allyship is perhaps more needed than ever. We have seen critical changes in
              perceptions about transgender equality, a worldwide increase in life-threatening
              penalisation of same-sex experiences, and growing struggles across the lives of
              Black, queer and disabled LGBTQIA+ people.
            </p>
            <p style={{ fontSize: "1.05rem", lineHeight: 1.65, opacity: 0.88, marginBottom: 18 }}>
              This quiz looks at allyship today. It has no scores and no badges. It is about what
              you do, not what you believe. The questions are hard on purpose, hard for everyone,
              the people who wrote them included.
            </p>
            <p style={{ fontSize: "1.05rem", lineHeight: 1.65, opacity: 0.88, marginBottom: 40 }}>
              Allyship is a journey. Stay with the discomfort as you go.
            </p>
            <button
              onClick={() => setStage("quiz")}
              style={{
                background: C.violet,
                color: C.charcoal,
                border: "none",
                borderRadius: 999,
                padding: "16px 44px",
                fontFamily: sans,
                fontWeight: 600,
                fontSize: "1.05rem",
                cursor: "pointer",
                letterSpacing: "0.02em",
              }}
            >
              Begin
            </button>
          </div>
        )}

        {/* ── QUIZ ── */}
        {stage === "quiz" && (
          <div style={{ paddingTop: 32 }}>
            {/* progress bar */}
            <div style={{ display: "flex", gap: 5, marginBottom: 28 }}>
              {QUESTIONS.map((_, i) => (
                <div key={i} style={{
                  flex: 1,
                  height: 3,
                  borderRadius: 3,
                  background: i <= idx ? C.violet : "rgba(247,241,232,0.18)",
                  transition: "background .3s",
                }} />
              ))}
            </div>

            <div className="fade" key={q.id}>
              <div style={{
                fontSize: ".75rem",
                letterSpacing: "0.14em",
                textTransform: "uppercase",
                opacity: 0.45,
                marginBottom: 16,
                fontFamily: sans,
              }}>
                {idx + 1} of {total}
              </div>
              <p style={{
                fontFamily: serif,
                fontSize: "clamp(1.35rem, 4vw, 1.65rem)",
                lineHeight: 1.3,
                fontWeight: 500,
                margin: "0 0 28px",
              }}>
                {q.scene}
              </p>

              {!revealed && q.options.map((opt, i) => (
                <button
                  key={i}
                  className="opt-btn"
                  onClick={() => choose(i)}
                  style={{
                    display: "block",
                    width: "100%",
                    textAlign: "left",
                    background: "rgba(247,241,232,0.04)",
                    color: C.offwhite,
                    border: `1px solid rgba(247,241,232,0.18)`,
                    borderRadius: 12,
                    padding: "16px 20px",
                    marginBottom: 10,
                    fontFamily: sans,
                    fontSize: "1rem",
                    lineHeight: 1.45,
                    cursor: "pointer",
                  }}
                >
                  {opt}
                </button>
              ))}

              {revealed && (
                <div className="fade">
                  <div style={{
                    background: "rgba(247,241,232,0.05)",
                    border: `1px solid ${C.gold}`,
                    borderRadius: 14,
                    padding: "20px 20px 22px",
                    marginBottom: 16,
                  }}>
                    <div style={{
                      fontFamily: serif,
                      fontStyle: "italic",
                      fontSize: "1.1rem",
                      opacity: 0.65,
                      marginBottom: 14,
                    }}>
                      You chose: {q.options[answers[q.id]]}
                    </div>
                    <p style={{ fontSize: "1.02rem", lineHeight: 1.65, margin: 0 }}>{q.reflect}</p>
                    {q.link && (
                      <a
                        href={q.link.url}
                        target="_blank"
                        rel="noopener"
                        style={{
                          display: "inline-block",
                          marginTop: 14,
                          color: C.violet,
                          fontSize: "0.92rem",
                          fontWeight: 600,
                          textDecoration: "underline",
                          textUnderlineOffset: 3,
                        }}
                      >
                        {q.link.label} →
                      </a>
                    )}
                  </div>
                  <button
                    onClick={next}
                    style={{
                      background: C.violet,
                      color: C.charcoal,
                      border: "none",
                      borderRadius: 999,
                      padding: "14px 34px",
                      fontFamily: sans,
                      fontWeight: 600,
                      fontSize: "1rem",
                      cursor: "pointer",
                      float: "right",
                    }}
                  >
                    {idx + 1 < total ? "Next" : "Finish"}
                  </button>
                  <div style={{ clear: "both" }} />
                </div>
              )}
            </div>
          </div>
        )}

        {/* ── RESULT ── */}
        {stage === "result" && (
          <div className="fade" style={{ paddingTop: 48 }}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 28 }}>
              <Rose size={80} />
            </div>
            <h2 style={{
              fontFamily: serif,
              fontWeight: 600,
              fontSize: "2rem",
              lineHeight: 1.1,
              textAlign: "center",
              margin: "0 0 24px",
            }}>
              The Ongoing Journey
            </h2>
            <p style={{ fontSize: "1.05rem", lineHeight: 1.65, opacity: 0.9, marginBottom: 16 }}>
              Allyship takes work, self-reflection and making conscious decisions to step up,
              over and over again. Being an ally isn't a label, it is embodied practice: we embed
              our changes in how we behave.
            </p>
            <p style={{ fontSize: "1.05rem", lineHeight: 1.65, opacity: 0.9, marginBottom: 32 }}>
              Do, don't perform, and keep doing. The job is never finished.
            </p>

            <div style={{ height: 1, background: "rgba(247,241,232,0.15)", margin: "0 0 32px" }} />

            <p style={{ fontFamily: serif, fontSize: "1.5rem", fontWeight: 500, margin: "0 0 8px" }}>
              Pick one thing.
            </p>
            <p style={{ fontSize: "0.96rem", lineHeight: 1.55, opacity: 0.75, marginBottom: 28 }}>
              Not ten. One. The point isn't the list, it's leaving with something real you'll actually do.
            </p>

            {Object.entries(ACTIONS).map(([key, group]) => (
              <div key={key} style={{ marginBottom: 26 }}>
                <div style={{
                  fontSize: ".75rem",
                  letterSpacing: "0.14em",
                  textTransform: "uppercase",
                  color: C.violet,
                  marginBottom: 12,
                  fontFamily: sans,
                }}>
                  {group.label}
                </div>
                {group.items.map((item, i) => {
                  const id = key + i;
                  const active = chosenAction === id;
                  return (
                    <button
                      key={id}
                      onClick={() => setChosenAction(active ? null : id)}
                      style={{
                        display: "flex",
                        gap: 12,
                        width: "100%",
                        textAlign: "left",
                        alignItems: "flex-start",
                        background: active ? C.violet : "rgba(247,241,232,0.05)",
                        color: active ? C.charcoal : C.offwhite,
                        border: `1px solid ${active ? C.violet : "rgba(247,241,232,0.15)"}`,
                        borderRadius: 12,
                        padding: "13px 16px",
                        marginBottom: 9,
                        fontFamily: sans,
                        fontSize: "0.97rem",
                        lineHeight: 1.45,
                        cursor: "pointer",
                        transition: "background .2s, color .2s, border-color .2s",
                      }}
                    >
                      <span style={{
                        flexShrink: 0,
                        width: 18,
                        height: 18,
                        borderRadius: "50%",
                        border: `2px solid ${active ? C.charcoal : C.gold}`,
                        background: active ? C.charcoal : "transparent",
                        marginTop: 2,
                      }} />
                      {item}
                    </button>
                  );
                })}
              </div>
            ))}

            {chosenAction && (
              <div className="fade" style={{
                background: C.green,
                color: C.offwhite,
                borderRadius: 14,
                padding: "18px 20px",
                marginTop: 16,
                fontSize: "1rem",
                lineHeight: 1.55,
              }}>
                That's your one. Do it this week, before the feeling fades. Then come back and pick another.
              </div>
            )}

            <p style={{ fontSize: ".95rem", lineHeight: 1.55, opacity: 0.82, marginTop: 32 }}>
              Want to go further?{" "}
              <a href="resources.html" style={{ color: C.violet, fontWeight: 600, textDecoration: "underline", textUnderlineOffset: 3 }}>
                Explore our resources
              </a>{" "}
              — a curated list of LGBTQIA+ allyship sources, including Stonewall, PFLAG and akt.
            </p>

            <div style={{ textAlign: "center", marginTop: 44, opacity: 0.4, fontSize: ".8rem" }}>
              Regent's University London LGBTQIA+ Staff Network · Pride 2026
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AllyshipQuiz />);
</script>
</body>
</html>
