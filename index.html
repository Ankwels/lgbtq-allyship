<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LGBTQIA+ Allyship, Regent's University London Staff Network</title>
<meta name="description" content="A short, honest allyship reflection. Regent's University London LGBTQIA+ Staff Network, Pride 2026." />
<style>
  :root {
    --green:    #195c4d;
    --offwhite: #f7f1e8;
    --violet:   #d8cbf1;
    --charcoal: #171f20;
    --gold:     #C3A35B;
    --salmon:   #FFA188;
    --lime:     #DAF092;
    --sky:      #A4DEEB;
    --pink:     #FF81B0;
    --cream:    #EEEED2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--charcoal);
    color: var(--offwhite);
    font-family: 'Avenir Next', 'Avenir', 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
  }

  #app {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0 22px 72px;
  }

  .inner {
    width: 100%;
    max-width: 480px;
  }

  /* ── ANIMATIONS ── */
  @keyframes roseSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade { animation: fadeUp .4s ease both; }

  /* ── TYPOGRAPHY ── */
  .serif {
    font-family: 'TS Magnole', 'Cormorant Garamond', Georgia, serif;
  }

  h1 {
    font-family: 'TS Magnole', 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 8vw, 2.7rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 22px;
  }

  h2 {
    font-family: 'TS Magnole', 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 2rem;
    line-height: 1.1;
    text-align: center;
    margin: 0 0 24px;
  }

  /* ── ROSETTE ── */
  .rose-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }
  .rose-spin {
    animation: roseSpin 24s linear infinite;
    display: block;
  }

  /* ── INTRO ── */
  #stage-intro {
    padding-top: 64px;
    text-align: center;
  }
  #stage-intro p {
    font-size: 1.05rem;
    line-height: 1.65;
    opacity: 0.88;
    margin-bottom: 18px;
  }
  #stage-intro p:last-of-type {
    margin-bottom: 40px;
  }

  /* ── PROGRESS ── */
  #progress-bar {
    display: flex;
    gap: 5px;
    margin-bottom: 28px;
    padding-top: 32px;
  }
  .progress-pip {
    flex: 1;
    height: 3px;
    border-radius: 3px;
    background: rgba(247,241,232,0.18);
    transition: background .3s;
  }
  .progress-pip.done {
    background: var(--violet);
  }

  /* ── QUESTION ── */
  .q-counter {
    font-size: .75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.45;
    margin-bottom: 16px;
  }
  .q-scene {
    font-family: 'TS Magnole', 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(1.35rem, 4vw, 1.65rem);
    line-height: 1.3;
    font-weight: 500;
    margin: 0 0 28px;
  }

  /* ── OPTION BUTTONS ── */
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(247,241,232,0.04);
    color: var(--offwhite);
    border: 1px solid rgba(247,241,232,0.18);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    font-family: 'Avenir Next', 'Avenir', system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.45;
    cursor: pointer;
    transition: transform .08s, border-color .18s, background .18s;
  }
  .opt-btn:hover {
    border-color: var(--violet);
    background: rgba(216,203,241,0.08);
  }
  .opt-btn:active { transform: scale(.985); }

  /* ── REFLECT PANEL ── */
  .reflect-panel {
    background: rgba(247,241,232,0.05);
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 20px 20px 22px;
    margin-bottom: 16px;
  }
  .reflect-chosen {
    font-family: 'TS Magnole', 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    opacity: 0.65;
    margin-bottom: 14px;
  }
  .reflect-text {
    font-size: 1.02rem;
    line-height: 1.65;
    margin: 0;
  }
  .reflect-link {
    display: inline-block;
    margin-top: 14px;
    color: var(--violet);
    font-size: 0.92rem;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ── BUTTONS ── */
  .btn-primary {
    background: var(--violet);
    color: var(--charcoal);
    border: none;
    border-radius: 999px;
    padding: 16px 44px;
    font-family: 'Avenir Next', 'Avenir', system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary.small {
    padding: 14px 34px;
    font-size: 1rem;
    float: right;
  }
  .clearfix::after { content: ''; display: table; clear: both; }

  /* ── RESULT ── */
  #stage-result {
    padding-top: 48px;
  }
  .result-intro p {
    font-size: 1.05rem;
    line-height: 1.65;
    opacity: 0.9;
    margin-bottom: 16px;
  }
  .divider {
    height: 1px;
    background: rgba(247,241,232,0.15);
    margin: 0 0 32px;
  }
  .pick-one-head {
    font-family: 'TS Magnole', 'Cormorant Garamond', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 500;
    margin: 0 0 8px;
  }
  .pick-one-sub {
    font-size: 0.96rem;
    line-height: 1.55;
    opacity: 0.75;
    margin-bottom: 28px;
  }

  /* ── ACTION GROUPS ── */
  .action-group { margin-bottom: 26px; }
  .action-label {
    font-size: .75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--violet);
    margin-bottom: 12px;
  }
  .action-btn {
    display: flex;
    gap: 12px;
    width: 100%;
    text-align: left;
    align-items: flex-start;
    background: rgba(247,241,232,0.05);
    color: var(--offwhite);
    border: 1px solid rgba(247,241,232,0.15);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 9px;
    font-family: 'Avenir Next', 'Avenir', system-ui, sans-serif;
    font-size: 0.97rem;
    line-height: 1.45;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
  }
  .action-btn.active {
    background: var(--violet);
    color: var(--charcoal);
    border-color: var(--violet);
  }
  .action-dot {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: transparent;
    margin-top: 2px;
    transition: border-color .2s, background .2s;
  }
  .action-btn.active .action-dot {
    border-color: var(--charcoal);
    background: var(--charcoal);
  }

  /* ── CHOSEN CONFIRMATION ── */
  #chosen-confirm {
    background: var(--green);
    color: var(--offwhite);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 16px;
    font-size: 1rem;
    line-height: 1.55;
    display: none;
  }
  #chosen-confirm.visible { display: block; }

  /* ── VIEW RESPONSES BUTTON ── */
  .recap-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: transparent;
    color: var(--offwhite);
    border: 1px solid rgba(247,241,232,0.3);
    border-radius: 999px;
    padding: 12px 28px;
    font-family: 'Avenir Next', 'Avenir', system-ui, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 24px;
    width: 100%;
    transition: border-color .2s, background .2s;
    text-decoration: none;
  }
  .recap-btn:hover {
    border-color: var(--violet);
    background: rgba(216,203,241,0.08);
  }

  /* ── RESOURCES LINK ── */
  .resources-nudge {
    font-size: .95rem;
    line-height: 1.55;
    opacity: 0.82;
    margin-top: 32px;
  }
  .resources-nudge a {
    color: var(--violet);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .footer-note {
    text-align: center;
    margin-top: 44px;
    opacity: 0.4;
    font-size: .8rem;
  }
</style>
</head>
<body>
<div id="app">
  <div class="inner" id="inner"></div>
</div>

<script>
const C = {
  green:    "#195c4d",
  offwhite: "#f7f1e8",
  violet:   "#d8cbf1",
  charcoal: "#171f20",
  gold:     "#C3A35B",
  salmon:   "#FFA188",
  lime:     "#DAF092",
  sky:      "#A4DEEB",
  pink:     "#FF81B0",
};

/* ── SVG Rosette ── */
function rosesvg(size, spin) {
  const petals = [C.salmon, C.gold, C.lime, C.violet, C.pink, C.sky, C.salmon, C.gold];
  const ellipses = petals.map((col, i) =>
    `<ellipse cx="50" cy="26" rx="11" ry="22" fill="${col}" opacity="0.88" transform="rotate(${i*45} 50 50)"/>`
  ).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"
    style="display:block;${spin ? 'animation:roseSpin 24s linear infinite;' : ''}">
    ${ellipses}
    <circle cx="50" cy="50" r="11" fill="${C.offwhite}"/>
    <circle cx="50" cy="50" r="5.5" fill="${C.gold}"/>
  </svg>`;
}

const QUESTIONS = [
  {
    id: "heyguys",
    scene: "You open a meeting with \u201chey guys.\u201d A colleague mentioned once that they find it gendered. In the moment, you\u2026",
    options: [
      "Don\u2019t notice you\u2019ve said it",
      "Notice, but it feels too small to interrupt the flow",
      "Catch it, correct yourself fast, and move on so nobody dwells on it",
      "Catch it, correct yourself, and let the small awkwardness sit",
    ],
    reflect: "Most of us say \u201chey guys\u201d without thinking. Correcting it once won\u2019t change that. You change it by catching yourself, again and again, until something like \u201ccolleagues\u201d or \u201ceveryone\u201d comes out instead.",
  },
  {
    id: "joke",
    scene: "A joke lands wrong. Could be homophobic, transphobic, ableist, racist, mild enough that it\u2019s \u201cjust a joke,\u201d clearly not meant with malice. Could be a senior colleague, could be a mate, could be a student in your seminar. The room half-laughs. You\u2026",
    options: [
      "Laugh along, it\u2019s not worth it",
      "Say nothing, but have a quiet word afterwards",
      "Say nothing, and feel bad about it later",
      "Name it lightly, there and then",
    ],
    reflect: "Speaking up is always worth it. The quiet word afterwards doesn\u2019t cost much, but it leaves everyone who heard the joke having watched you stay silent. Speak up when you witness it.",
  },
  {
    id: "onequeer",
    scene: "Something about LGBTQ+ life comes up at work. It\u2019s a discussion about LGBTQ+ intersections, in particular disability and neurodiversity. There\u2019s only one or two openly queer people in the room. You\u2026",
    options: [
      "Turn to them, they\u2019ll know best",
      "Ask them to explain, it\u2019s easier than looking it up",
      "Wait to see if they want to speak before anyone looks at them",
      "Look it up yourself, and don\u2019t make it their job to teach you",
    ],
    reflect: "It feels respectful to turn to the disabled or neurodivergent queer person in the room, like you\u2019re centring their voice, but it quietly makes them the spokesperson for everyone like them. In the words of Stonewall: \u201ca marginalised person is not responsible for teaching you about their identity\u2026 please listen to our experiences, but don\u2019t expect us to be a spokesperson for all LGBT disabled people.\u201d",
    link: { label: "Stonewall: being an ally to LGBT disabled people", url: "https://www.stonewall.org.uk/news/8-ways-be-better-ally-lgbt-disabled-people" },
  },
  {
    id: "pronouns",
    scene: "You meet someone new, or you\u2019re starting a class or a meeting. Their appearance reads clearly as one gender to you. You\u2026",
    options: [
      "Use the pronouns that seem obvious (to you)",
      "Go round the room, everyone says their pronouns",
      "Get corrected, you switch at that point",
      "Don\u2019t assume. Let people know pronouns are important, and allow a low-pressure way for people to share theirs if they want to (in their email signature, or on Blackboard)",
    ],
    reflect: "It\u2019s worth noticing how fast we gender people based on their looks. Using people\u2019s correct pronouns shows that we respect them and who they are. However, a forced round of pronouns can put someone on the spot when they don\u2019t feel safe to say. Visibility isn\u2019t safe for everyone, and for some people sharing pronouns at all is a risk. It might not always be immediately obvious what pronouns someone uses, but you can suggest people add their pronouns in their email signature, social media profile or Blackboard, if it feels safe for them, rather than demanding they declare them to a room.",
    link: { label: "Stonewall: 10 ways to be an ally to trans and non-binary people", url: "https://www.stonewall.org.uk/resources/lgbtq-hubs/trans-hub/10-ways-to-step-up-as-an-ally-to-trans-and-non-binary-people" },
  },
  {
    id: "getitwrong",
    scene: "You misgender someone, or use a term you hadn\u2019t clocked has shifted. You\u2019re corrected. Your first inward feeling is\u2026",
    options: [
      "Defensiveness, you didn\u2019t mean anything by it",
      "A hot flush of embarrassment you want to escape",
      "The urge to over-apologise and explain yourself",
      "Take it in, and get it right next time",
    ],
    reflect: "Most of these slips just mean we\u2019re human and still learning. The over-apologising is a trap. It looks like taking responsibility, but it often ends with them having to reassure you. This puts the work back on them. PFLAG\u2019s line is that you can feel embarrassed, but you shouldn\u2019t make the moment about your feelings. Take responsibility, get it right next time. Being an ally is about what we do, not what we feel.",
  },
  {
    id: "samedifference",
    scene: "A colleague says they \u201ctreat everyone the same,they don\u2019t see someone\u2019s sexuality or gender.\u201d You think this is\u2026",
    options: [
      "Fair enough, that\u2019s equality",
      "Mostly well meant, and fine",
      "Well meant, but missing something",
      "A way of not quite seeing people",
    ],
    reflect: "\u201cI treat everyone the same\u201d usually means treating everyone like the normative default, and that default leaves out the queer and anyone whose difference doesn\u2019t fit the norm. Not seeing difference often means not seeing what some people are up against. Most people aren\u2019t asking to be treated identically. They\u2019re asking to be seen fully.",
  },
  {
    id: "blacktrans",
    scene: "Black LGBTQIA+ people, and Black trans people especially, are too often left out of the media, of workplaces, of LGBTQ+ representation. When you notice it happening, you\u2026",
    options: [
      "Assume the wider LGBTQ+ cause already covers them",
      "Care, but leave it to Black people to raise it",
      "Say something when it\u2019s clearly bad",
      "Use your privilege to centre and amplify Black LGBTQIA+ people, and challenge racism vocally so your spaces don\u2019t perpetuate barriers to inclusion",
    ],
    reflect: "White, cis, straight or non-disabled, most of us carry some privilege we didn\u2019t earn, some doors that open easier. Recognising it is the easy part. Using it is the work. Your allyship isn\u2019t inclusive if it leaves out Black LGBTQIA+ people, and specifically Black trans people, whose oppression is compounded and who get overlooked even within Black and within LGBTQ+ spaces.",
    link: { label: "Stonewall\u2019s QTIPOC Hub", url: "https://www.stonewall.org.uk/resources/lgbtq-hubs/qtipoc-hub" },
  },
  {
    id: "theroom",
    scene: "A room, plenty of LGBTQ+ and straight people, allies and supporters, you among them. Look around. Who\u2019s at the centre? Who\u2019s at the edge, or missing? Is the room still mostly white? Mostly non-disabled? The same few voices? Who else isn\u2019t here? You\u2026",
    options: [
      "Hadn\u2019t thought about it, everyone here means well",
      "Have noticed, but assume someone closer to it will say something",
      "Mention it when it\u2019s clearly gone too far",
      "Watch who gets centred, and use whatever room you have to shift it",
    ],
    reflect: "It\u2019s tempting to think allyship runs one way, straight to queer, and stops there. It doesn\u2019t. Inside any LGBTQ+ space there are still insiders and outsiders, and the people at the edge are usually the same ones pushed out everywhere else, by ethnicity, by disability, by class, by how their queerness reads. The work is noticing who\u2019s still not in the room, and you don\u2019t have to be queer, or straight, to have a part in it.",
  },
];

const ACTIONS = [
  {
    label: "Takes a minute",
    items: [
      "Add your pronouns to your email signature or display name. Costs nothing, signals plenty.",
      "Learn three terms you were unsure about. The PFLAG glossary at pflag.org/glossary is a good start.",
      "Follow one LGBTQ+ organisation or creator, and actually read what they share, not just like and scroll.",
    ],
  },
  {
    label: "This week",
    items: [
      "Use \u201cpartner\u201d instead of assuming, next time it comes up.",
      "Correct a misgendering quietly, even when the person isn\u2019t in the room. Especially then.",
      "Read one of the \u201c10 things you can do\u201d guides from Stonewall or PFLAG.",
    ],
  },
  {
    label: "When you\u2019re ready",
    items: [
      "Speak up the one time you\u2019d normally let a \u201cjoke\u201d slide.",
      "Amplify rather than speak over. When someone\u2019s said it well, share it and credit them.",
      "Show up where it counts, a meeting, a vote, a room where it would be easier not to.",
    ],
  },
];

/* ── State ── */
let stage = "intro";   // intro | quiz | result
let idx = 0;
let answers = {};
let revealed = false;
let chosenAction = null;

const el = id => document.getElementById(id);
const inner = el("inner");

function scrollTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── Render ── */
function render() {
  scrollTop();
  if (stage === "intro")  renderIntro();
  else if (stage === "quiz")   renderQuiz();
  else if (stage === "result") renderResult();
}

function renderIntro() {
  inner.innerHTML = `
    <div class="fade" style="padding-top:64px;text-align:center;">
      <div class="rose-wrap">${rosesvg(96, true)}</div>
      <h1>Allyship 2026</h1>
      <p>LGBTQIA+ allyship is perhaps more needed than ever. We have seen critical changes in
      perceptions about transgender equality, a worldwide increase in life-threatening
      penalisation of same-sex experiences, and growing struggles across the lives of
      Black, queer and disabled LGBTQIA+ people.</p>
      <p style="margin-top:28px;">This quiz looks at allyship today. It has no scores and no badges. It is about what
      you do, not what you believe. The questions are hard on purpose, hard for everyone,
      the people who wrote them included.</p>
      <p style="margin-top:28px;margin-bottom:52px;">Allyship is a journey. Stay with the discomfort as you go.</p>
      <button class="btn-primary" onclick="startQuiz()">Begin</button>
    </div>`;
}

function renderQuiz() {
  const q = QUESTIONS[idx];
  const total = QUESTIONS.length;

  const pips = QUESTIONS.map((_, i) =>
    `<div class="progress-pip ${i <= idx ? 'done' : ''}"></div>`
  ).join('');

  const options = !revealed ? QUESTIONS[idx].options.map((opt, i) =>
    `<button class="opt-btn" onclick="choose(${i})">${opt}</button>`
  ).join('') : '';

  const reflectLink = revealed && q.link
    ? `<a class="reflect-link" href="${q.link.url}" target="_blank" rel="noopener">${q.link.label} →</a>`
    : '';

  const reflectPanel = revealed ? `
    <div class="reflect-panel fade">
      <div class="reflect-chosen">You chose: ${q.options[answers[q.id]]}</div>
      <p class="reflect-text">${q.reflect}</p>
      ${reflectLink}
    </div>
    <div class="clearfix">
      <button class="btn-primary small" onclick="next()">
        ${idx + 1 < total ? 'Next' : 'Finish'}
      </button>
    </div>` : '';

  inner.innerHTML = `
    <div id="progress-bar">${pips}</div>
    <div class="fade" id="q-wrap">
      <div class="q-counter">${idx + 1} of ${total}</div>
      <p class="q-scene">${q.scene}</p>
      ${options}
      ${reflectPanel}
    </div>`;
}

function renderResult() {
  const actionGroups = ACTIONS.map((group, gi) => {
    const btns = group.items.map((item, ii) => {
      const id = `${gi}-${ii}`;
      const active = chosenAction === id;
      return `<button class="action-btn ${active ? 'active' : ''}" onclick="pickAction('${id}')">
        <span class="action-dot"></span>${item}
      </button>`;
    }).join('');
    return `<div class="action-group">
      <div class="action-label">${group.label}</div>
      ${btns}
    </div>`;
  }).join('');

  inner.innerHTML = `
    <div class="fade" id="stage-result">
      <div class="rose-wrap">${rosesvg(80, false)}</div>
      <h2>The Ongoing Journey</h2>
      <div class="result-intro">
        <p>Allyship takes work, self-reflection and making conscious decisions to step up,
        over and over again. Being an ally isn\u2019t a label, it is embodied practice: we embed
        our changes in how we behave.</p>
      </div>
      <div class="divider"></div>
      <p class="pick-one-head">What next?</p>
      <p class="pick-one-sub">Pick one allyship task to consider. The list doesn\u2019t matter, this is just one possible thing you, we all, can do.</p>
      ${actionGroups}
      <div id="chosen-confirm" class="${chosenAction ? 'visible' : ''}">
        That\u2019s your one. Do it this week, before the feeling fades. Then come back and pick another.
      </div>
      <p class="resources-nudge">Want to go further?
        <a href="resources.html">Explore our resources</a>
        , a curated list of LGBTQIA+ allyship sources, including Stonewall, PFLAG and akt.
      </p>
      <button class="recap-btn" onclick="goToRecap()">
        View your responses
      </button>
      <p class="footer-note">Regent\u2019s University London LGBTQIA+ Staff Network \u00b7 Pride 2026</p>
    </div>`;
}

/* ── Actions ── */
function startQuiz() {
  stage = "quiz";
  idx = 0;
  answers = {};
  revealed = false;
  render();
}

function choose(optIdx) {
  answers[QUESTIONS[idx].id] = optIdx;
  revealed = true;
  renderQuiz();
}

function next() {
  revealed = false;
  if (idx + 1 < QUESTIONS.length) {
    idx++;
  } else {
    stage = "result";
    chosenAction = null;
  }
  render();
}

function pickAction(id) {
  chosenAction = chosenAction === id ? null : id;
  const confirm = el("chosen-confirm");
  if (confirm) {
    if (chosenAction) confirm.classList.add("visible");
    else confirm.classList.remove("visible");
  }
  document.querySelectorAll(".action-btn").forEach(btn => btn.classList.remove("active"));
  if (chosenAction) {
    const btns = document.querySelectorAll(".action-btn");
    btns.forEach(btn => {
      if (btn.getAttribute("onclick") === `pickAction('${id}')`) {
        btn.classList.add("active");
      }
    });
  }
}

function goToRecap() {
  sessionStorage.setItem('allyshipAnswers', JSON.stringify(answers));
  window.location.href = 'recap.html';
}

/* ── Init ── */
render();
</script>
